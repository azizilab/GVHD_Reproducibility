name: MLR
channels:
  - conda-forge
  - r
  - defaults
dependencies:
  - r-base=4.3.3
  - r-rmarkdown=2.29

  # Data manipulation
  - r-tidyverse=2.0.0
  - r-dplyr=1.1.4
  - r-purrr=1.1.0
  - r-tibble=3.3.0
  - r-readxl=1.4.5
  - r-plyr=1.8.9
  - r-scales=1.4.0

  # Visualization
  - r-ggplot2=3.5.2
  - r-gridextra=2.3
  - r-pheatmap=1.0.13
  - r-patchwork=1.3.2
  - r-ggalluvial=0.12.5
  - r-ggtext=0.1.2
  - r-plotly=4.11.0
  - r-cowplot=1.2.0
  - r-ggbeeswarm=0.7.2
  - r-ggpubr=0.6.1
  - r-ggrepel=0.9.6

  # Statistical analysis
  - r-rstatix=0.7.2
  - r-tidymodels=1.4.1

  # Diversity / dimensionality reduction
  - r-factoextra=1.0.7
  - r-lvplot=0.2.1

  # Utilities
  - r-eulerr=7.0.2
  - r-docstring=1.0.0

# ---------------------------------------------------------------------------
# GitHub-only packages — install after `conda activate MLR`:
#
#   Rscript -e "install.packages('remotes')"
#   Rscript -e "remotes::install_github('immunomind/cdr3tools')"
#   Rscript -e "remotes::install_github('agentlans/KneeArrower')"
#
# cdr3tools : TCR CDR3 analysis (immunoSeq clone identification)
# KneeArrower: knee-point detection for diversity thresholds
# ---------------------------------------------------------------------------
